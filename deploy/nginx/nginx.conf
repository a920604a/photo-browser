worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  # Log without leaking Authorization header.
  log_format  main '$remote_addr - $status "$request" '
                   'reqid=$http_x_request_id ua="$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  upstream photo_backend {
    server backend:8080;
  }

  server {
    listen 80 default_server;

    client_max_body_size 1m;

    location / {
      proxy_pass http://photo_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $http_x_request_id;
      # Preserve backend cache-control / etag headers verbatim.
      proxy_pass_header ETag;
      proxy_pass_header Cache-Control;
    }

    location /internal-media/originals/ {
      internal;
      autoindex off;
      alias /srv/photos/;
      add_header X-Content-Type-Options nosniff always;
    }

    location /internal-media/thumbnails/ {
      internal;
      autoindex off;
      alias /srv/thumbnails/;
      add_header X-Content-Type-Options nosniff always;
      # The backend already sets Cache-Control on the redirecting response and
      # proxy_pass_header carries it through; repeating it here duplicated the
      # header on every thumbnail.
    }
  }
}
